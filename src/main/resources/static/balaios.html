<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balaios – Café Gestor</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
</head>
<body class="app" data-pagina="balaios" data-protegida>
  <a class="pular-conteudo" href="#conteudo">Ir para o conteúdo</a>
  <div class="app-layout">
    <aside class="menu" id="menu" aria-label="Menu principal">
      <div class="menu-topo">
        <button type="button" class="menu-toggle" id="menu-toggle" aria-controls="menu-nav" aria-expanded="false" aria-label="Abrir ou fechar o menu">&#9776;</button>
        <span id="menu-perfil"></span>
      </div>
      <nav class="menu-nav" id="menu-nav" aria-label="Seções do sistema"></nav>
      <div class="menu-rodape">
        <span id="menu-usuario"></span>
        <button type="button" class="btn btn-link" id="btn-sair">Sair</button>
      </div>
    </aside>

    <main class="conteudo" id="conteudo" tabindex="-1">
      <header class="cabecalho">
        <p class="marca">CAFE GESTOR</p>
        <h1 class="titulo-pagina">Balaios</h1>
      </header>
      <noscript><p class="aviso aviso-erro">Este sistema precisa de JavaScript ativado para funcionar.</p></noscript>

      <section class="painel" aria-label="Lista de balaios">
        <div class="barra-ferramentas">
          <div class="campo">
            <label for="filtro-funcionario">Funcionário</label>
            <select id="filtro-funcionario"></select>
          </div>
          <div class="campo">
            <label for="filtro-tipo">Tipo de café</label>
            <select id="filtro-tipo"></select>
          </div>
          <div class="campo">
            <label for="filtro-data">Data</label>
            <input type="date" id="filtro-data">
          </div>
          <button type="button" class="btn btn-secundario" id="btn-limpar-filtros">Limpar filtros</button>
          <a class="btn btn-primario" id="btn-novo" href="balaio-form.html" hidden>Registrar balaios</a>
        </div>
        <p class="ajuda" id="contagem" aria-live="polite"></p>
        <div class="tabela-wrapper">
          <table class="tabela">
            <caption class="visualmente-oculto">Balaios registrados</caption>
            <thead>
              <tr>
                <th scope="col">Data</th>
                <th scope="col">Funcionário</th>
                <th scope="col">Tipo de café</th>
                <th scope="col" class="numero">Quantidade</th>
              </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
            <tfoot>
              <tr>
                <td colspan="3">Total de balaios na lista</td>
                <td class="numero" id="total-balaios">0</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/validacao.js"></script>
  <script src="js/pagina.js"></script>
  <script src="js/pagina-balaios.js"></script>
</body>
</html>
