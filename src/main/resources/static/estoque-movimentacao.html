<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Estoque – Café Gestor</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
</head>
<body class="app" data-pagina="estoque-movimentacao" data-protegida data-exige-edicao>
  <a class="pular-conteudo" href="#conteudo">Ir para o conteúdo</a>
  <div class="app-layout">
    <aside class="menu" id="menu" aria-label="Menu principal">
      <div class="menu-topo">
        <button type="button" class="menu-toggle" id="menu-toggle" aria-controls="menu-nav" aria-expanded="false" aria-label="Abrir ou fechar o menu">&#9776;</button>
        <span id="menu-perfil"></span>
      </div>
      <nav class="menu-nav" id="menu-nav" aria-label="Seções do sistema"></nav>
      <div class="menu-rodape">
        <span id="menu-usuario"></span>
        <button type="button" class="btn btn-link" id="btn-sair">Sair</button>
      </div>
    </aside>

    <main class="conteudo" id="conteudo" tabindex="-1">
      <header class="cabecalho">
        <p class="marca">CAFE GESTOR</p>
        <h1 class="titulo-pagina">Controle de Estoque</h1>
      </header>
      <noscript><p class="aviso aviso-erro">Este sistema precisa de JavaScript ativado para funcionar.</p></noscript>

      <section class="painel">
        <h2>Registrar movimentação</h2>
        <form id="form-estoque" class="formulario" novalidate>
          <div class="campo">
            <label for="tipoCafeId" class="obrigatorio">Tipo de café</label>
            <select id="tipoCafeId" name="tipoCafeId"></select>
            <span class="erro" id="erro-tipoCafeId" role="alert"></span>
          </div>
          <p>Saldo atual: <span class="saldo-destaque" id="saldo-atual" aria-live="polite"></span></p>
          <div class="campo">
            <label for="quantidade" class="obrigatorio">Quantidade (sacas)</label>
            <input type="text" id="quantidade" name="quantidade" inputmode="numeric" maxlength="7" autocomplete="off">
            <span class="erro" id="erro-quantidade" role="alert"></span>
          </div>
          <div class="campo">
            <label for="descricao">Destino (obrigatório na saída) ou nota da entrada</label>
            <input type="text" id="descricao" name="descricao" maxlength="100" autocomplete="off">
            <span class="erro" id="erro-descricao" role="alert"></span>
          </div>
          <p class="erro erro-geral" id="erro-geral" role="alert"></p>
          <div class="acoes-form">
            <button type="button" class="btn btn-entrada" id="btn-entrada">Entrada</button>
            <button type="button" class="btn btn-saida" id="btn-saida">Saída</button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/validacao.js"></script>
  <script src="js/pagina.js"></script>
  <script src="js/pagina-estoque-movimentacao.js"></script>
</body>
</html>
