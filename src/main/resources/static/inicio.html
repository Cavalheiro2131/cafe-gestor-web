<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Início – Café Gestor</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
</head>
<body class="app" data-pagina="inicio" data-protegida>
  <a class="pular-conteudo" href="#conteudo">Ir para o conteúdo</a>
  <div class="app-layout">
    <aside class="menu" id="menu" aria-label="Menu principal">
      <div class="menu-topo">
        <button type="button" class="menu-toggle" id="menu-toggle" aria-controls="menu-nav" aria-expanded="false" aria-label="Abrir ou fechar o menu">&#9776;</button>
        <span id="menu-perfil"></span>
      </div>
      <nav class="menu-nav" id="menu-nav" aria-label="Seções do sistema"></nav>
      <div class="menu-rodape">
        <span id="menu-usuario"></span>
        <button type="button" class="btn btn-link" id="btn-sair">Sair</button>
      </div>
    </aside>

    <main class="conteudo" id="conteudo" tabindex="-1">
      <header class="cabecalho">
        <p class="marca">CAFE GESTOR</p>
        <h1 class="titulo-pagina">Bem-vindo</h1>
      </header>
      <noscript><p class="aviso aviso-erro">Este sistema precisa de JavaScript ativado para funcionar.</p></noscript>

      <section class="painel">
        <h2 id="boas-vindas">Bem-vindo!</h2>
        <p id="texto-perfil"></p>
      </section>

      <section class="grade-cartoes" aria-label="Resumo do sistema">
        <article class="cartao-estat">
          <h3>Funcionários ativos</h3>
          <p class="numero" id="estat-funcionarios">–</p>
        </article>
        <article class="cartao-estat">
          <h3>Balaios registrados</h3>
          <p class="numero" id="estat-balaios">–</p>
        </article>
        <article class="cartao-estat">
          <h3>Sacas em estoque</h3>
          <p class="numero" id="estat-estoque">–</p>
        </article>
      </section>

      <section class="painel" aria-labelledby="titulo-simulador">
        <h2 id="titulo-simulador">Simulador de produção</h2>
        <p class="ajuda">Informe o total de balaios colhidos e quantos balaios formam uma saca para ver o rendimento.</p>
        <form id="form-simulador" class="form-linha" novalidate>
          <div class="campo">
            <label for="balaiosTotal" class="obrigatorio">Total de balaios</label>
            <input type="text" id="balaiosTotal" name="balaiosTotal" inputmode="numeric" maxlength="7">
            <span class="erro" id="erro-balaiosTotal" role="alert"></span>
          </div>
          <div class="campo">
            <label for="balaiosPorSaca" class="obrigatorio">Balaios por saca</label>
            <input type="text" id="balaiosPorSaca" name="balaiosPorSaca" inputmode="numeric" maxlength="4" value="8">
            <span class="erro" id="erro-balaiosPorSaca" role="alert"></span>
          </div>
        </form>
        <p class="resultado" id="resultado-simulador" aria-live="polite" hidden></p>
      </section>
    </main>
  </div>
  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/validacao.js"></script>
  <script src="js/pagina.js"></script>
  <script src="js/pagina-inicio.js"></script>
</body>
</html>
