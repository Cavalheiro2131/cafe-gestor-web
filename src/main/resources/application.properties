spring.application.name=cafe-gestor
server.port=8080

# Banco de dados (MySQL). Os valores podem ser trocados por variáveis de ambiente,
# para que usuário e senha não fiquem no código nem no GitHub.
spring.datasource.url=${CAFE_DB_URL:jdbc:mysql://localhost:3306/cafe_gestor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CAFE_DB_USER:root}
spring.datasource.password=${CAFE_DB_PASS:}

# Sessão de login (cookie)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Durante o desenvolvimento, as páginas estáticas não ficam em cache
spring.web.resources.cache.period=0
